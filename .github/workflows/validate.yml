name: Validate catalog
on:
  pull_request:
    paths:
      - 'skills/**'
      - 'mcp/**'
      - 'tools/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'index.json'
      - 'index.schema.json'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'mcp/**'
      - 'tools/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'index.json'
      - 'index.schema.json'
      - '.github/workflows/validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs
